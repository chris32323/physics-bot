# Jeden Morgen ein neues Video – nach den automatischen Prüfungen wird es direkt hochgeladen.
# Manuell gestartet mit Änderungswunsch: überarbeitet die letzte Folge (wird nur hochgeladen,
# wenn diese Folge noch nicht online ist).
name: Daily video

on:
  schedule:
    - cron: "17 4 * * *"          # 04:17 UTC = 05:17 Uhr deutscher Winterzeit (06:17 Sommerzeit)
  workflow_dispatch:
    inputs:
      feedback:
        description: "Änderungswunsch für das letzte Video (leer lassen = neues Video zum nächsten Thema)"
        required: false
        default: ""

permissions:
  contents: write                 # Fortschritt (state.json, episodes/) zurück ins Repo speichern

jobs:
  make:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    concurrency:
      group: physics-bot-make
      cancel-in-progress: false
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      BOT_APPROVAL: github
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ffmpeg and fonts
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ffmpeg fonts-inter

      - name: Install Python packages
        run: pip install -r requirements.txt

      - name: Restore voice cache
        uses: actions/cache@v4
        with:
          path: build/voice_cache
          key: voice-${{ github.run_id }}
          restore-keys: voice-

      - name: Make video
        env:
          FEEDBACK: ${{ github.event.inputs.feedback }}
        run: |
          if [ -n "$FEEDBACK" ]; then
            python bot.py redo "$FEEDBACK"
          else
            python bot.py daily
          fi

      - name: Save progress
        if: always()
        run: |
          git config user.name "physics-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add episodes state.json
          if ! git diff --cached --quiet; then
            git commit -m "Episode update $(date -u +%F)"
            git pull --rebase
            git push
          fi

      - name: Upload video
        uses: actions/upload-artifact@v4
        with:
          name: episode
          path: |
            build/out/*.mp4
            build/out/info.json
            build/out/subtitles.srt
          retention-days: 14

  publish:
    needs: make
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: physics-bot-publish
      cancel-in-progress: false
    env:
      YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      TIKTOK_ACCESS_TOKEN: ${{ secrets.TIKTOK_ACCESS_TOKEN }}
      TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
      TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
      TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
      GH_SECRETS_TOKEN: ${{ secrets.GH_SECRETS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python packages
        run: pip install -r requirements.txt

      - uses: actions/download-artifact@v4
        with:
          name: episode
          path: build/latest

      - name: Upload to the platforms
        env:
          GH_TOKEN: ${{ github.token }}
        run: python bot.py publish build/latest

      - name: Save progress
        if: always()
        run: |
          git config user.name "physics-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          if ! git diff --cached --quiet; then
            git commit -m "Published $(date -u +%F)"
            git pull --rebase
            git push
          fi
