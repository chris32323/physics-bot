# Reserve: lädt das zuletzt erstellte Video von Hand hoch (z. B. bei einem privaten Repo ohne Freigabe-Funktion).
name: Publish video

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read                   # um das Video aus dem letzten "Daily video"-Lauf zu holen

concurrency:
  group: physics-bot
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      TIKTOK_ACCESS_TOKEN: ${{ secrets.TIKTOK_ACCESS_TOKEN }}
      TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
      TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
      TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
      GH_SECRETS_TOKEN: ${{ secrets.GH_SECRETS_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python packages
        run: pip install -r requirements.txt

      - name: Download the latest video
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN_ID=$(gh run list --workflow daily.yml --status success --limit 1 --json databaseId -q '.[0].databaseId')
          if [ -z "$RUN_ID" ]; then echo "Kein fertiges Video gefunden."; exit 1; fi
          gh run download "$RUN_ID" -n episode -D build/latest

      - name: Upload to the platforms
        env:
          GH_TOKEN: ${{ github.token }}
        run: python bot.py publish build/latest

      - name: Save progress
        if: always()
        run: |
          git config user.name "physics-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          if ! git diff --cached --quiet; then
            git commit -m "Published $(date -u +%F)"
            git pull --rebase
            git push
          fi
